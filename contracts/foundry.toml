[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# 0G Newton testnet: use --legacy --gas-price 10000000000 when deploying
# Example: forge script script/Deploy.s.sol --rpc-url $RPC_URL --broadcast --legacy --gas-price 10000000000

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }

[rpc_endpoints]
zerog_newton = "${RPC_URL}"
sepolia      = "https://rpc.sepolia.org"
