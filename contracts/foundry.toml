[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
# 0G Galileo testnet only supports Shanghai EVM (not Cancun).
# Cancun opcodes MCOPY (0x5e), TSTORE (0x5d), TLOAD (0x5c) cause "invalid opcode"
# reverts on complex functions (uploadStory) while simpler functions (createVault) happen
# to avoid the problematic paths.  Shanghai gives PUSH0 and all pre-Cancun opcodes.
evm_version = "shanghai"
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# 0G Galileo testnet: use --legacy --gas-price 10000000000 when deploying
# Example: forge script script/Deploy.s.sol --rpc-url $RPC_URL --broadcast --legacy --gas-price 10000000000

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }

[rpc_endpoints]
zerog_galileo = "${RPC_URL}"
zerog_newton  = "${RPC_URL}"
sepolia       = "https://rpc.sepolia.org"
